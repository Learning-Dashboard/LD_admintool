server:
  port: ${ADMINTOOL_PORT:8080}

ld:
  api:
    url: ${ADMINTOOL_LD_API_URL:https://eaa864cb69ae.ngrok-free.app/api}
    key: ${LD_API_KEY:}
  eval:
    url: ${ADMINTOOL_EVAL_URL:http://localhost:5001}
  connect:
    url: ${ADMINTOOL_LD_CONNECT_URL:http://localhost:5000}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:example}
    driver-class-name: org.postgresql.Driver

# Per-subject credentials (GitHub token, Taiga server, teams). It is the same
# file that LD Connect uses: LD_Connect_Event/config_files/credentials_config.json
credentials:
  file: ${CREDENTIALS_FILE:config_files/credentials_config.json}

# Fallback Taiga, used by the subjects that leave taiga_api_url and
# taiga_auth_url empty in the credentials file.
taiga:
  fallback:
    api-url: ${TAIGA_FALLBACK_API_URL:}
    auth-url: ${TAIGA_FALLBACK_AUTH_URL:}
    username: ${TAIGA_FALLBACK_USERNAME:}
    password: ${TAIGA_FALLBACK_PASSWORD:}
